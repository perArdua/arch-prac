  - {dir: s2-dominant, label: 소수 지배 s=2, zipf_s: 2.0, emulates: 두 사람의 관계에 갇힌 롤플레이 — 기억 대부분에 같은 이름(지우·서준)과 같은 몇 가지 소재가 나온다. s=2는 사람 슬롯 1위(지우)의 몫 ≈ 62%가 eval에서 `지우`가 색인 21행 중 12행(57%)에 나온 것과 가장 가까운 정수 지수라서 골랐다.}
