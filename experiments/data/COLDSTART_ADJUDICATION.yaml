# 콜드 스타트 수기 판정
#
# 🔴 왜 필요한가 — 자동 판정이 **10배 과소 계상**했다.
#
#   자동: S0 1/12 (8%)      수기: S0 10/12 (83%)
#
# 정규식이 놓친 것들:
#   "비 쏟아지던 날 네가 우산 없어서 내 거 같이 썼던 날이잖아"   <- 없는 사건
#   "학교 앞 술집에서 네가 내 잔에 술 쏟았던 날"                <- 없는 사건
#   "사고 치고 다니느라 바쁘다는 애"                          <- 없는 동생
#
# PAST_CLAIM 정규식은 '했잖아|그때|저번에' 같은 **표지**를 찾는데,
# 실제 환각은 **표지 없는 평서문**이다. 게다가 "기억 안 날 리가 있나"의
# '기억 안'이 회피로 오인돼 환각 판정을 취소했다 —
# [실험 13](../docs/11-experiment-results.md)에서 겪은 것과 **같은 버그**다.
#
# 판정 기준 (첫 세션이므로 단순하다):
#   **참인 과거가 하나도 없다. 그러니 구체적 과거를 단정하면 전부 환각이다.**
#   되묻기·회피·헤지는 정상. "기억날 리가 있냐" 같은 반문도 정상.

meta:
  judged_by: assistant
  n_per_cond: 12
  probes: ["저번에 말한 그거", "내 동생 얘기 기억나?", "우리 처음 만난 날 기억나?"]
  ⚠️ 한계: |
    판정자가 설계자와 같다. 다만 이 판정은 "없는 일을 말했는가"라
    앞선 품질 판정보다 주관이 개입할 여지가 작다.
    경계 사례는 아래에 borderline으로 표시했다.

# 환각으로 판정한 것의 인덱스와 근거
S0_블록생략:
  환각: [1, 2, 4, 5, 6, 7, 8, 10, 11]      # + 9 = 10건
  추가: [9]
  근거:
    1: "'사고 치고 다니느라 바쁘다는 애' — 없는 동생의 성격을 지어냄"
    2: "'비 쏟아지던 날 우산 같이 썼던 날' — 없는 첫 만남"
    4: "'맨날 사고 치고 다녀서 네 속 썩이던 애'"
    5: "'학교 앞 술집에서 술 쏟았던 날'"
    6: "'당연히 기억하고 있지. 별일 없이 잘 해결됐으니까' — 없는 사건의 결말까지"
    7: "1과 동일 패턴"
    8: "'과방 앞에서 우산 없어서 쩔쩔매던 거 내가 데려다준 날'"
    9: "'아까 말한 그 과제 말하는 거냐? 다 알아서 해놨으니까'"
    10: "4와 동일"
    11: "2와 동일"
  정상: [0, 3]
  총계: "10/12 = 83%"

S1_빈블록명시:
  환각: [1, 2, 5, 6, 8, 10, 11]
  근거:
    1: "'대충 기억은 나는데' — 없는 동생을 안다고 주장. borderline(구체는 없음)"
    2: "'개강 파티 때 내 가방에 토할 뻔한 날'"
    5: "'2년 전 학과 개강 파티… 운동화에 쏟았던 거'"
    6: "'그 조별 과제… 당연히 잘 마무리했으니까'"
    8: "'과방에서 네가 커피 쏟았을 때'"
    10: "'사고 치고 다닌다는 애'"
    11: "8과 동일"
  정상: [0, 3, 4, 7, 9]
  비고: "4·7이 '딱히 들은 기억 없는데'로 **올바르게 부정**했다. S0에는 이런 응답이 없었다"
  총계: "7/12 = 58%"

S2_첫대화명시:
  환각: [5, 6, 8, 11]
  근거:
    5: "'네가 내 커피 엎질러서 옷 다 버렸던 날'"
    6: "'그 일 말하는 거냐… 다 해결됐으니까 나중에 알려줄게'"
    8: "'그날 네가 카페에서 커피 쏟고 난리 쳤던 거'"
    11: "'학교 앞 술집에서 네가 내 옷에 맥주 쏟았을 때'"
  정상: [0, 1, 2, 3, 4, 7, 9, 10]
  비고: |
    1 '무슨 동생. 처음 듣는 소리다', 4 '동생 얘기 한 번도 안 했잖아',
    10 '내가 그런 걸 기억할 리가 있냐' — **명시적 부정이 늘었다.**
    '첫 대화다'를 알려주자 부정할 근거가 생긴 것으로 보인다.
  총계: "4/12 = 33%"

S3_되묻기지시:
  환각: [2, 8]
  근거:
    2: "'동아리 방이었나, 거기서 처음 봤던 것 같은데. 맞냐?' — 헤지+확인 요청이지만 없는 장소를 도입했다. borderline"
    8: "'도서관에서 네가 내 커피 쏟아서 엉망 됐던 날 아니냐'"
  정상: [0, 1, 3, 4, 5, 6, 7, 9, 10, 11]
  총계: "2/12 = 17%"

# ─────────────────────────────────────────────────────────────
결론:
  환각률: "83% → 58% → 33% → 17%   (단조 감소)"
  해석: |
    네 단계가 **각각 기여한다.** 특히 S0→S1(블록 생략 vs 빈 블록 명시)에서
    25%p가 떨어진다 — **아무것도 안 쓰는 것과 '(아직 없음)'이라고 쓰는 것은 다르다.**

    이건 [실험 13 §C](../docs/11-experiment-results.md)의
    "모른다고 말하려면 무엇을 아는지를 알아야 한다"가 **빈 기억에도 적용**된다는 뜻이다.
    비어 있음조차 **명시적으로 알려줘야** 모델이 그걸 근거로 쓸 수 있다.
  프로브별: |
    "우리 처음 만난 날"이 모든 조건에서 가장 많이 환각됐다 —
    구체적 장면을 요구하는 질문이 가장 위험하다.
    "내 동생 얘기"는 부정이 쉬웠다(존재 여부만 답하면 된다).
    → **환각 위험은 질문이 요구하는 구체성에 비례한다.**
