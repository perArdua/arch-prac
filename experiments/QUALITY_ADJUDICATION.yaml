# 🔴 결과가 제 가설을 반박했다.
#    가설: A0(0/6)와 A2(6/6)의 차이가 **규칙 블록** 때문일 것이다.
#    실측: 규칙만 주면 0/6 -> **2/6**. 도움은 되지만 **부족하다.**
#    -> 환각 방어의 주된 힘은 규칙이 아니라 **기억(경계 정보)**에서 온다.
#       "모른다고 말하려면 무엇을 아는지를 알아야 한다"가 다시 확인됐다.
#
# ⚠️ A2의 6/6은 액면대로 읽으면 안 된다. A2는 **사실 문항 20개도 거의 전부 회피**했다.
#    '항상 모른다고 답하는' 퇴화 전략은 abstention에서 자동으로 만점이다.
#    진짜 실력은 **답할 땐 답하고 모를 땐 모른다고 하는 것**이고, 그건 제안안·G1만 보인다.
