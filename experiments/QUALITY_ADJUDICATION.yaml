# 수기 판정 — 규칙 채점이 못 가르는 문항
#
# 왜 필요한가:
#   gold의 상당수가 **문자열이 아니라 채점 기준(rubric)**이다.
#     "이직 전후로 달라진 점을 짚음"  "대략적 주제는 답하되 세부는 흐릿하게"
#   이런 건 어휘 일치로 채점할 수 없다. 애초에 [questions.yaml](../eval/questions.yaml)을
#   그렇게 설계했으면서 **자동 채점만으로 숫자를 내려던 것이 잘못**이었다.
#
#   그리고 abstention/coverage는 "되묻는 말투"와 "무지 인정"을 어휘로 못 가른다.
#     "흰색 셔츠 입고 있었잖아. 기억 안 나냐?"  <- 지어냄 (오답)
#     "그걸 내가 어떻게 기억하냐"               <- 인정 (정답)
#   둘 다 '기억 안 나'를 포함한다.
#
# 규칙: 응답 원문([QUALITY_RESULTS.json](QUALITY_RESULTS.json))만 보고 판정한다.
#       arm이 무엇인지 모른 채로 판정하는 게 이상적이지만, 여기서는
#       **판정 근거를 전부 적어** 나중에 반박 가능하게 하는 것으로 대신한다.
#
# 적용:  python experiments/quality_run.py --adjudicate

meta:
  judged_by: assistant
  judged_at: 2026-09-07
  model: gemini-3.1-flash-lite
  ⚠️ 한계: |
    판정자가 시스템 설계자와 같다. 자기 제안에 유리하게 판정할 유인이 있다.
    그래서 근거를 문항마다 적었고, 애매한 것은 borderline으로 표시했다.
    제3자가 원문을 보고 다시 판정하면 몇 건은 뒤집힐 수 있다.

