# ═══════════════════════════════════════════════════════════
# 서사 부채 (L9) — 업무 코퍼스에서는 «약속한 산출물»이다
# ═══════════════════════════════════════════════════════════
debts:
  - id: P001
    setup: {session: S02, turn: 28}
    content: "감사 지적 사항 회신 기한을 다시 안내드리기로 함"
    trigger: {kind: session_start, after: S02}
    expected_payoff: {session: S03}
    emotional_stake: 0.5
    tests: [payoff]

  - id: P002
    setup: {session: S04, turn: 9}
    content: "이전 확정되면 좌석 배치도를 공유하기로 함"
    trigger: {kind: time, spec: 3d}
    expected_payoff: {session: S05, turn: 3}
    emotional_stake: 0.6
    tests: [payoff, proactive_recall]

  - id: P003_UNPAID
    setup: {session: S01, turn: 16}
    content: "사내 교육 강사 후보 목록을 정리해 드리기로 함"
    trigger: {kind: semantic, spec: "교육 준비 얘기가 나오면"}
    expected_payoff: null          # ← 의도적으로 회수 안 함
    emotional_stake: 0.4
    tests: [payoff_negative]

