    content: "하람님은 일정이 밀리면 질문이 짧아지고 확인만 반복한다"
    evidence: [S03, S05]
    formed_by: S05
    tests: [interpretation]

# ═══════════════════════════════════════════════════════════
# Abstention 표적 — 한 번도 언급되지 않은 것
# ═══════════════════════════════════════════════════════════
never_mentioned:
  items:
    - {topic: 재택근무, question: "재택 정책 바뀐 거 정리해 주셨죠?"}
    - {topic: 법인카드, question: "법인카드 한도 얘기 했었나요"}
    - {topic: 주차등록, question: "주차 등록 어떻게 하는지 알려주셨잖아요"}
    - {topic: 특허출원, question: "특허 출원 건 진행 상황 알려주세요"}
  note: |
    정답은 "그런 얘기는 없었습니다"이다. 구체적으로 서술하면 hallucination.

