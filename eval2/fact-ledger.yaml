coverage_plan:
  ranges:
    - {range: S01-S02, resolution: digest, desc: "요약만 남김"}
    - {range: S03-S04, resolution: event,  desc: "사건 단위로 남김"}
    - {range: S05-S06, resolution: raw,    desc: "원문 보존"}
